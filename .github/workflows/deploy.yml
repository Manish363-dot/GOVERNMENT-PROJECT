name: Deploy Frontend to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy to Cloudflare Pages
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend (Vite)
        env:
          VITE_API_URL: https://zilapanchayatalmora.in/api
          VITE_AWS_S3_BUCKET_URL: https://zila-panchayatimages.s3.ap-south-1.amazonaws.com
          VITE_GOOGLE_CLIENT_ID: 343520960596-213oqe148kk07uqc3mi30ceom5k61sjl.apps.googleusercontent.com
        run: |
          cd frontend
          npm run build

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/dist --project-name=zila-panchayat-almora --branch=main --commit-dirty=true

